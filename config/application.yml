server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/billing.log
module:
  name: billing
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  invoice_tax_line:
    collection: invoice_tax_lines
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  payment_schedule:
    collection: payment_schedules
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  purchase_invoice:
    collection: purchase_invoices
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  purchase_invoice_line:
    collection: purchase_invoice_lines
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  sales_invoice:
    collection: sales_invoices
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  sales_invoice_line:
    collection: sales_invoice_lines
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
