# Codegen policy for billing.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  - "src/application/service/billing_events.rs"
  - "src/application/service/billing_gl.rs"
  - "src/application/service/billing_write_service.rs"
  # Focused siblings of billing_write_service — one BillingWriteService inherent impl split by
  # concern (A/R ledger, A/P ledger, the cash loop).
  - "src/application/service/billing_purchase.rs"
  - "src/application/service/billing_sales.rs"
  - "src/application/service/billing_settlement.rs"
  - "src/application/service/settlement_consumer.rs"
  # Payment-terms master: pure schedule derivation + the invoice-post materialization hook.
  - "src/application/service/term_schedule.rs"
  # Own the hand-written AR/AP SQL (the draft header + line + tax-overlay inserts, the post builders'
  # projections, the pending→posted reconcile, the credit note, and the settlement drawdown) that the
  # write service orchestrates. Declared here — not renamed with a `_custom` suffix — so the generator
  # skips them wholesale; this declaration is what makes editing them legitimate.
  - "src/infrastructure/persistence/invoice_tax_line_repository.rs"
  - "src/infrastructure/persistence/payment_schedule_repository.rs"
  - "src/infrastructure/persistence/purchase_invoice_repository.rs"
  - "src/infrastructure/persistence/purchase_invoice_line_repository.rs"
  - "src/infrastructure/persistence/sales_invoice_repository.rs"
  - "src/infrastructure/persistence/sales_invoice_line_repository.rs"
  # Not schema-derived at all: the settlement drawdown spans BOTH invoice tables by a runtime kind,
  # so it has no entity of its own.
  - "src/infrastructure/persistence/invoice_settlement_repository.rs"
  # Payment-terms master SQL (header + lines + the invoice materialization writes) — user-owned
  # for the same reason as the settlement repository above.
  - "src/infrastructure/persistence/payment_term_repository.rs"
  - "src/presentation/http/guarded_routes.rs"
  - "tests/billing_golden_cases.rs"
  - "tests/integrity_probes.rs"
  - "tests/ap_seam.rs"
  - "tests/settlement_graph_seam.rs"
  - "tests/schedules_and_events.rs"
  # Tax-engine integration: the billing→tax seam (moved here from backbone-tax so the cargo
  # edge stays billing→tax) + the template-driven create-path cases.
  - "tests/tax_seam.rs"
  - "tests/document_tax_cases.rs"
  # Payment-terms behavior suite: derivation goldens, validation refusals, the split-fence
  # probes, the derived overdue read, and the early-pay-discount resolver's window/clamp cases.
  - "tests/payment_term_schedule_golden.rs"
  - "tests/term_validation_refusals.rs"
  - "tests/global_term_fence_suite.rs"
  - "tests/overdue_derived_read.rs"
  - "tests/resolve_early_pay_discount.rs"
  - "migrations/20260820100000_invoice_tax_line_tax_columns.up.sql"
  - "migrations/20260820100000_invoice_tax_line_tax_columns.down.sql"
  # Hand-written migrations: the invoice-side term/EPD columns + the payment-terms split fence.
  - "migrations/20260820100003_invoice_payment_term_columns.up.sql"
  - "migrations/20260820100003_invoice_payment_term_columns.down.sql"
  - "migrations/20260820100004_payment_terms_split_fence.up.sql"
  - "migrations/20260820100004_payment_terms_split_fence.down.sql"
  # The hand-written global-template seed (the seeder target's stub would clobber it).
  - "migrations/seeds/payment_term_seed.sql"
  - "scripts/**"
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"

  # Hand-authored module documentation.
  - "docs/**"
