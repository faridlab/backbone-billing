# =============================================================================
# Domain: Billing
# Entity: InvoiceTaxLine (the REMOVABLE tax overlay)
# Description: Tax lines keyed by a LOGICAL invoice ref (no DB FK to the invoice)
# — localization-standard §1: the base invoice carries no tax columns; PPN/PPh
# live here. Two population paths: caller-supplied lines (region-neutral billing
# never computes tax itself), or computed by backbone-tax's document engine when
# an invoice line carries a tax template — those rows additionally persist the
# engine's routing (template, repartition split, and the real account a cash-basis
# amount flips to at payment). Remove this table and invoices still compute +
# post clean (net only). `basis` distinguishes output (PPN out), input (PPN in),
# and withholding (PPh).
# =============================================================================

models:
  - name: InvoiceTaxLine
    collection: invoice_tax_lines
    description: "A tax line attached to an invoice by logical ref (removable overlay)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique tax-line id"

      invoice_ref:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The invoice id this tax line belongs to (logical — sales or purchase)"

      invoice_kind:
        type: InvoiceKind
        attributes: ["@required"]
        description: "Which invoice table `invoice_ref` points at"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id (denormalized from the parent invoice — resolved via invoice_ref+invoice_kind — so the overlay row passes the ADR-0008 RLS fence on its own)"

      account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Tax account # logical FK to accounting.Account.id (PPN Output/Input or PPh Payable)"

      basis:
        type: TaxBasis
        attributes: ["@required"]
        description: "output (PPN out) | input (PPN in) | withholding (PPh, a deduction)"

      description:
        type: string?
        attributes: ["@max(150)"]
        description: "Tax-line label (e.g. 'PPN Keluaran 11%')"

      taxable_base:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Base the tax was computed on"

      rate:
        type: decimal
        attributes: ["@default(0)", "@precision(9,4)", "@non_negative"]
        description: "Percentage rate applied (informational; amount is authoritative)"

      tax_amount:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Tax amount (posted to account_id)"

      tax_template_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The backbone-tax template that produced this line (engine-computed rows only; NULL for caller-supplied lines)"

      repartition_line_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The tax repartition split whose factor produced this amount (NULL for legacy template routing)"

      real_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "For cash-basis (on_payment) rows: the real tax account the amount flips to as payments reconcile — account_id holds the transition account meanwhile"

      exigibility:
        type: TaxExigibility
        attributes: ["@default(on_invoice)"]
        description: "When the tax becomes exigible: on_invoice (accrual, the default) or on_payment (cash basis, deferred through the transition account)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [invoice_ref, invoice_kind]

enums:
  - name: InvoiceKind
    description: "Which invoice a tax line / schedule belongs to"
    variants:
      - name: sales
        description: "Sales invoice (AR)"
        default: true
      - name: purchase
        description: "Purchase invoice (A/P)"

  - name: TaxBasis
    description: "Kind of tax line"
    variants:
      - name: output
        description: "Output VAT (PPN Keluaran) — credited on a sales invoice"
        default: true
      - name: input
        description: "Input VAT (PPN Masukan) — debited on a purchase invoice"
      - name: withholding
        description: "Withholding tax (PPh) — deducted from A/P, credited to PPh Payable"

  - name: TaxExigibility
    description: "When a tax amount becomes exigible (engine-computed rows; caller-supplied lines are always on_invoice)"
    variants:
      - name: on_invoice
        description: "Accrual — exigible when the invoice posts"
        default: true
      - name: on_payment
        description: "Cash basis — deferred through a transition account, flipped pro-rata as payments reconcile"
