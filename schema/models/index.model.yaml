# =============================================================================
# billing Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA billing` and qualify tables
# as `billing.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: billing
version: 2
schema: billing
description: "Billing: region-neutral AR/AP invoicing (Sales + Purchase Invoice) emitting revenue/expense AccountingPosts into backbone-accounting; tax via a removable InvoiceTaxLine overlay; drives buying.mark_billed via PurchaseInvoicePosted."

# ADR-0014 company fence: every entity here is company-scoped and fenced strict —
# invoice headers and their child lines (tax lines, payment schedules) each carry
# company_id and are fenced; no cross-company invoice data. No exceptions.
company_fence: strict

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model (parents before children).
imports:
  - sales_invoice.model.yaml
  - purchase_invoice.model.yaml
  - invoice_tax_line.model.yaml
  - payment_schedule.model.yaml
