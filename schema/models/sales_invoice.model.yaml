# =============================================================================
# Domain: Billing
# Entity: SalesInvoice (+ SalesInvoiceLine)
# Description: REGION-NEUTRAL AR invoice — recognises revenue. Carries NO tax
# columns (localization-standard §1); PPN/PPh land in the removable InvoiceTaxLine
# overlay. On post, billing assembles net lines + overlay tax into ONE balanced
# revenue AccountingPost (Dr A/R · Cr Revenue · Cr PPN Output). All cross-module
# refs are logical FKs.
# =============================================================================

models:
  - name: SalesInvoice
    collection: sales_invoices
    description: "Region-neutral AR invoice; emits a revenue AccountingPost on post"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique invoice identifier"

      invoice_number:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Human reference (the post's source_reference)"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id"

      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Branch # logical FK to organization.Branch.id"

      customer_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Customer # logical FK to party.Party.id (the A/R subledger party)"

      source_so_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Source sales order # logical FK to selling.SalesOrder.id"

      status:
        type: InvoiceStatus
        attributes: ["@default(draft)"]
        description: "Document lifecycle"

      posting_date:
        type: date
        attributes: ["@required"]
        description: "Invoice / posting date"

      due_date:
        type: date?
        description: "Payment due date"

      currency:
        type: string
        attributes: ["@default(\"IDR\")", "@max(3)"]
        description: "ISO currency code"

      # Generic aggregates (NOT tax-specific columns). tax_total is Σ of the overlay's output lines.
      net_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ line net amounts (the revenue credit, pre-tax)"

      tax_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ overlay output-tax lines (0 if the overlay is removed)"

      grand_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "net_total + tax_total (the A/R debit)"

      outstanding_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Unpaid balance (starts = grand_total on post)"

      receivable_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "A/R control account (debit_to) # logical FK to accounting.Account.id"

      posting_state:
        type: GlPostingState
        attributes: ["@default(pending)"]
        description: "GL reconciliation state"

      journal_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Resulting journal # logical FK to accounting.Journal.id"

      accounting_post_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The AccountingPost record # logical FK to accounting.AccountingPost.id"

      posted_at:
        type: datetime?
        description: "When the GL post was confirmed"

      notes:
        type: string?
        attributes: ["@max(1000)"]
        description: "Free-text notes"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      lines:
        type: SalesInvoiceLine[]
        attributes: ["@one_to_many"]
        description: "Revenue lines"
        inverse: invoice

    indexes:
      - type: unique
        fields: [invoice_number]
        where: "deleted_at IS NULL"
      - type: index
        fields: [company_id, customer_id, status]
      - type: index
        fields: [posting_state]

  - name: SalesInvoiceLine
    collection: sales_invoice_lines
    description: "One net revenue line (no tax — tax is the overlay's job)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"

      invoice_id:
        type: uuid
        attributes: ["@required", "@foreign_key(SalesInvoice.id)"]
        description: "Owning invoice"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id (denormalized from the header so the line row passes the ADR-0008 RLS fence on its own)"

      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id"

      revenue_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Income account # logical FK to accounting.Account.id"

      description:
        type: string?
        attributes: ["@max(300)"]
        description: "Line description snapshot"

      quantity:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@non_negative"]
        description: "Quantity billed"

      unit_price:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Price per unit"

      net_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "quantity * unit_price (computed; no tax)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      invoice:
        type: SalesInvoice
        attributes: ["@one", "@foreign_key(invoice_id)"]
        description: "Owning invoice"
        inverse: lines

    indexes:
      - type: index
        fields: [invoice_id]

# =============================================================================
# Enums (shared across billing)
# =============================================================================

enums:
  - name: InvoiceStatus
    description: "Invoice document lifecycle"
    variants:
      - name: draft
        description: "Being prepared; not posted"
        default: true
      - name: submitted
        description: "Submitted; posted to the GL"
      - name: partially_paid
        description: "Some payment received/made"
      - name: paid
        description: "Fully settled"
      - name: cancelled
        description: "Voided (reversed in the GL)"

  - name: GlPostingState
    description: "GL-posting reconciliation state"
    variants:
      - name: pending
        description: "Not yet posted"
        default: true
      - name: posted
        description: "Confirmed posted"
      - name: failed
        description: "Rejected by accounting"
