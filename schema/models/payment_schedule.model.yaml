# =============================================================================
# Domain: Billing
# Entity: PaymentSchedule
# Description: Installment due dates for an invoice (AR or A/P), keyed by logical
# invoice ref. Lean "keep" scope; settlement is backbone-payments' concern —
# billing only records the schedule. PaymentTerms master + dunning deferred.
# =============================================================================

models:
  - name: PaymentSchedule
    collection: payment_schedules
    description: "One installment due against an invoice (AR or A/P)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique schedule-row id"

      invoice_ref:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The invoice id this installment belongs to (logical)"

      invoice_kind:
        type: InvoiceKind
        attributes: ["@required"]
        description: "Which invoice table `invoice_ref` points at"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id"

      installment_no:
        type: int
        attributes: ["@required"]
        description: "Installment sequence (1..N)"

      due_date:
        type: date
        attributes: ["@required"]
        description: "When this installment is due"

      amount:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Installment amount"

      paid_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Amount settled against this installment (by backbone-payments)"

      status:
        type: PaymentScheduleStatus
        attributes: ["@default(unpaid)"]
        description: "Settlement state of this installment"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [invoice_ref, invoice_kind]
      - type: index
        fields: [company_id, due_date, status]

enums:
  - name: PaymentScheduleStatus
    description: "Settlement state of an installment"
    variants:
      - name: unpaid
        description: "Not yet settled"
        default: true
      - name: partially_paid
        description: "Partly settled"
      - name: paid
        description: "Fully settled"
      - name: overdue
        description: "Past due, unsettled (dunning input)"
